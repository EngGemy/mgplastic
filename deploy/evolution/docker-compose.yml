# Evolution API (Baileys) — run on any machine with Docker + a public URL/IP.
# Not for shared cPanel PHP hosting. Point MG Plastic WHATSAPP_EVOLUTION_URL here.
services:
  evolution-api:
    container_name: mg_evolution_api
    image: atendai/evolution-api:v2.1.1
    restart: always
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=${SERVER_URL}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=MG Plastic
      - CONFIG_SESSION_PHONE_NAME=Chrome
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
